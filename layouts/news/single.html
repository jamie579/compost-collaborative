{{ define "main" }}
<main id="main-content" tabindex="-1" class="band-prose g-light">
  <article class="prose z">
    <p class="eyebrow caps"><a href="{{ "news/" | relURL }}">⊕ News from the heap</a></p>
    <h1 class="caps">{{ .Title }}</h1>
    {{ range where site.Data.news.items "path" .RelPermalink }}
    <p class="news-date">{{ .date_context }}: <time datetime="{{ .date }}">{{ .date_label }}</time></p>
    {{ end }}
    {{ .Content }}
    <p><a href="{{ "news/" | relURL }}">All news from the heap →</a></p>
  </article>
</main>
{{ end }}
