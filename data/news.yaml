# Homepage news items.
items:
  - title: "Seven of us at IPONS 2026"
    text: "Jess co-chaired the 28th International Nursing Philosophy Conference at UC Irvine (July 2026) — with the collective's Borderlands symposium, two camp conversations, and crip futures on the programme."
    link: "https://ipons.online/2025/07/29/28th-annual-international-hybrid-nursing-philosophy-conference-july-22-24-2026/"
  - title: "Annie-Claude joins the professoriate"
    text: "Annie-Claude Laurin is now Assistant Professor in the Faculté des sciences infirmières at Université Laval, and a researcher at IUCPQ."
    link: "https://www.fsi.ulaval.ca/actualites/bienvenue-a-annie-claude-laurin-nouvelle-professeure-assistante"
  - title: "Funding for LGBTQ2S+ nursing research"
    text: "Patrick Martin received a Fondation de l'IUCPQ grant for his study of LGBTQ2S+ nurses' experiences of caring for LGBTQ2S+ patients."
    link: "https://www.fsi.ulaval.ca/actualites/nouvelle-subvention-pour-patrick-martin-de-la-fondation-de-liucpq"
